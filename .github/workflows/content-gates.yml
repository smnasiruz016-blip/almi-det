name: content gates

# Runs the content-integrity gates on every push and PR.
#
# The gates are also wired into `npm run build`, so a Vercel deploy blocks on
# them too. CI exists on top of that for one reason: AlmiDET's preview deploys
# currently fail before the build starts, so Vercel is not a reliable place to
# see a gate result. CI runs with no database and no secrets beyond the package
# token, which is exactly what the gates were designed to need.

on:
  push:
    branches: ["**"]
  pull_request:

# The repo has no NODE_AUTH_TOKEN secret, so Install falls back to GITHUB_TOKEN.
# That token can read the private almi-data package only if the job is granted
# packages: read (and the package lists this repo under "Manage Actions access").
permissions:
  contents: read
  packages: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # Pure node: no install, no database, no secrets.
      - name: offer gate (RR-397, free 48 hours, no card)
        run: node scripts/gates/offer-48h.mjs
      - name: family header and footer gate (RR-398)
        run: node scripts/gates/family-nav.mjs
      - name: text contrast gate (RR-400, WCAG AA text shades)
        run: node scripts/gates/text-contrast.mjs

      # @smnasiruz016-blip/almi-data is a private GitHub Packages dependency;
      # .npmrc reads NODE_AUTH_TOKEN.
      - name: Install
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN || secrets.GITHUB_TOKEN }}

      # The gates read the Prisma enum, so the client must exist. No database is
      # contacted — scripts/gates/_bank.mts supplies a dummy DATABASE_URL.
      - name: Generate Prisma client
        run: npx prisma generate

      # RR-399 A3: the free AI use is atomic (pure: a fake store with the database's unique rule; no DB, no AI)
      - name: free AI claim test (RR-399)
        run: npx tsx scripts/verify-free-ai-claim.ts

      # RR-401: the content factory (pack parser, LanguageTool gate on fixtures, word counts, pending rule, seed dry run + idempotence; no DB, no network)
      - name: factory test (RR-401)
        run: npx tsx scripts/factory/factory.test.mts

      - name: Content gates
        run: npm run gate:all
